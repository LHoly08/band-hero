[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "band-hero-stem-splitter"
version = "0.1.0"
description = "Audio stem separation for Band Hero song processing."
requires-python = ">=3.10"
dependencies = [
    "demucs>=4,<5",
    "numpy",
]

[project.scripts]
stem-splitter = "stem_splitter.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["stem_splitter*"]
